name: MiniBank Lab
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results
          path: results/
