services:
  minibank_before:
    build: .
    environment:
      LAB_MODE: before
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - demo
  minibank:
    build: .
    environment:
      LAB_MODE: fixed
      OPA_URL: http://opa:8181/v1/data/minibank/authz/allow
    depends_on:
      - opa
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - lab
      - demo
  opa:
    image: openpolicyagent/opa:1.9.0
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policy/minibank.rego"]
    volumes:
      - ./app/policy/after/minibank.rego:/policy/minibank.rego:ro
    read_only: true
    networks:
      - lab
  regression:
    build:
      context: .
      dockerfile: Dockerfile.tests
    profiles:
      - tests
    environment:
      OPA_DIRECT_URL: http://opa:8181/v1/data/minibank/authz/allow
      FIXED_URL: http://minibank:8000
    depends_on:
      - minibank_before
      - minibank
      - opa
    volumes:
      - ./tests/results:/lab/tests/results
    networks:
      - lab
      - demo
networks:
  lab:
    internal: true
  demo:
